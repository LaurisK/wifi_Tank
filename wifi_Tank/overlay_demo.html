<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WiFi Tank</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        /* ── Status bar ── */
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #555;
            flex-shrink: 0;
        }

        .dot.on  { background-color: #4CAF50; box-shadow: 0 0 8px #4CAF50; }
        .dot.off { background-color: #f44336; }

        /* ── Main layout: params left (30%) + stream right (70%) ── */
        .main-layout {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        /* ── Parameters panel (left column) ── */
        .params-col {
            flex: 0 0 30%;
            min-width: 240px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 10px 12px;
            box-sizing: border-box;
        }

        /* ── Stream column (right) ── */
        .stream-col {
            flex: 1 1 70%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        /* ── Video + canvas ── */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 2px solid #444;
            border-radius: 5px;
            overflow: hidden;
            background-color: #000;
        }

        #videoStream {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }

        #overlayCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* ── Below-video row: WASD pad ── */
        .below-video {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
        }

        /* ── WASD pad ── */
        .wasd-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            user-select: none;
        }

        .wasd-row {
            display: flex;
            gap: 4px;
        }

        .wasd-key {
            width: 48px;
            height: 48px;
            border: 2px solid #555;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #888;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.05s, color 0.05s, border-color 0.05s;
        }

        .wasd-key.active {
            background-color: #4CAF50;
            border-color: #4CAF50;
            color: #fff;
        }

        .wasd-key.active.slow {
            background-color: #ff9800;
            border-color: #ff9800;
        }

        .wasd-key.spacer { visibility: hidden; }

        .wasd-label {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 4px;
        }

        #slowBadge {
            color: #ff9800;
            font-weight: bold;
            margin-left: 6px;
            display: none;
        }

        /* ── Parameters panel internals ── */

        /* Section divider + title row */
        .sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            border-top: 1px solid #3a3a3a;
            margin: 10px 0 6px 0;
            padding-top: 8px;
        }
        .sec-head:first-child {
            border-top: none;
            margin-top: 0;
            padding-top: 0;
        }
        .sec-title {
            color: #4CAF50;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .params-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 5px;
        }

        .params-msg {
            min-height: 14px;
            font-size: 11px;
            margin: 2px 0 4px 0;
            color: #888;
        }

        .params-select {
            flex: 1;
            min-width: 0;
            padding: 5px 7px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 13px;
        }

        .params-input {
            flex: 1;
            min-width: 0;
            padding: 5px 8px;
            font-size: 13px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #1a1a1a;
            color: #fff;
        }

        button {
            padding: 5px 11px;
            font-size: 13px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover    { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        .btn-icon {
            padding: 5px 8px;
            background-color: #333;
            font-size: 13px;
        }
        .btn-icon:hover { background-color: #444; }

        .btn-danger {
            background-color: #c0392b;
        }
        .btn-danger:hover  { background-color: #a93226; }

        .rot-btn {
            padding: 4px 9px;
            font-size: 12px;
            background: #333;
        }
        .rot-btn:hover            { background: #444; }
        .rot-btn.active-rot       { background: #4CAF50; }
        .rot-btn.active-rot:hover { background: #45a049; }

        .cam-check-label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ESP32 WiFi Tank</h1>

        <div class="status">
            <div class="status-item">
                <span class="dot" id="dotOverlay"></span>
                <span>Overlay</span>
                <span style="color:#888;font-size:12px;">(<span id="updateCount">0</span> frames)</span>
            </div>
            <div class="status-item">
                <span class="dot" id="dotCtrl"></span>
                <span>Control</span>
            </div>
        </div>

        <div class="main-layout">

            <!-- ── Parameters panel (left 30%) ── -->
            <div class="params-col">

                <!-- Device Name -->
                <div class="sec-head">
                    <span class="sec-title">Device</span>
                </div>

                <div class="params-row">
                    <input type="text" id="deviceName" class="params-input"
                           placeholder="tank_xxxx" maxlength="32"
                           onkeydown="if(event.key==='Enter')saveDeviceName()" />
                    <button onclick="saveDeviceName()">Save</button>
                </div>
                <div class="params-msg" id="deviceMsg"></div>

                <!-- WiFi Networks -->
                <div class="sec-head">
                    <span class="sec-title">WiFi Networks</span>
                    <button class="btn-icon" onclick="loadNetworks()" title="Reload from device">↺</button>
                </div>

                <div class="params-row">
                    <select id="netSelect" class="params-select" onchange="onNetSelectChange()">
                        <option value="new">+ New network</option>
                    </select>
                </div>

                <div class="params-row" id="newSsidRow" style="display:none;">
                    <input type="text" id="newSsid" class="params-input" placeholder="SSID" />
                </div>

                <div class="params-row">
                    <input type="password" id="netPass" class="params-input" placeholder="Password" />
                    <button class="btn-icon" id="showPassBtn" onclick="togglePassVisibility()" title="Show/hide password">👁</button>
                    <button class="btn-danger btn-icon" id="deleteNetBtn" onclick="deleteNetwork()" disabled title="Delete network">✕</button>
                    <button id="saveNetBtn" onclick="saveNetwork()">Add</button>
                </div>

                <div class="params-msg" id="netMsg"></div>

                <!-- Camera -->
                <div class="sec-head">
                    <span class="sec-title">Camera</span>
                </div>

                <div class="params-row">
                    <button class="rot-btn active-rot" id="rot0"   onclick="setRotation(0)">0°</button>
                    <button class="rot-btn"            id="rot90"  onclick="setRotation(90)">90°</button>
                    <button class="rot-btn"            id="rot180" onclick="setRotation(180)">180°</button>
                    <button class="rot-btn"            id="rot270" onclick="setRotation(270)">270°</button>
                    <span style="flex:1"></span>
                    <label class="cam-check-label"><input type="checkbox" id="hMirrorChk" onchange="applyVideoTransform()"> ↔H</label>
                    <label class="cam-check-label"><input type="checkbox" id="vMirrorChk" onchange="applyVideoTransform()"> ↕V</label>
                </div>

                <!-- Controls -->
                <div class="sec-head">
                    <span class="sec-title">Controls</span>
                </div>

                <div class="params-row">
                    <span style="font-size:12px;color:#999;white-space:nowrap;">Ramp rate</span>
                    <input type="number" id="rampRate" class="params-input"
                           min="1" max="500" placeholder="50"
                           style="max-width:70px;"
                           onkeydown="onRampKeydown(event)" />
                    <span style="font-size:12px;color:#888;">%/s</span>
                </div>

                <div class="params-msg" id="rampMsg"></div>

                <!-- Firmware OTA -->
                <div class="sec-head">
                    <span class="sec-title">Firmware</span>
                    <span id="fwVersion" style="font-size:10px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;">—</span>
                </div>

                <div class="params-row">
                    <input type="file" id="otaFile" accept=".bin" class="params-input"
                           style="padding:3px 5px;font-size:12px;" onchange="onOtaFileChange()" />
                    <button id="otaUploadBtn" onclick="startOta()" disabled>Upload</button>
                </div>

                <div id="otaProgress" style="display:none;margin-bottom:4px;">
                    <div style="background:#1a1a1a;border-radius:4px;height:10px;overflow:hidden;margin-bottom:4px;">
                        <div id="otaBar" style="height:100%;width:0%;background:#4CAF50;transition:width 0.15s;"></div>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:11px;color:#999;">
                        <span id="otaPct">0%</span>
                        <span id="otaSpeed">—</span>
                        <span id="otaEta">—</span>
                    </div>
                </div>

                <div class="params-msg" id="otaMsg"></div>

            </div><!-- /params-col -->

            <!-- ── Stream column (right 70%) ── -->
            <div class="stream-col">

                <div class="video-container">
                    <img id="videoStream" alt="Video Stream" />
                    <canvas id="overlayCanvas" width="1280" height="720"></canvas>
                </div>

                <div class="below-video">
                    <div>
                        <div class="wasd-pad">
                            <div class="wasd-row">
                                <div class="wasd-key spacer"></div>
                                <div class="wasd-key" id="key-w">W</div>
                                <div class="wasd-key spacer"></div>
                            </div>
                            <div class="wasd-row">
                                <div class="wasd-key" id="key-a">A</div>
                                <div class="wasd-key" id="key-s">S</div>
                                <div class="wasd-key" id="key-d">D</div>
                            </div>
                        </div>
                        <div class="wasd-label">
                            keyboard control
                            <span id="slowBadge">⅓ SPEED</span>
                        </div>
                    </div>
                </div>

            </div><!-- /stream-col -->

        </div><!-- /main-layout -->

    </div>

    <script>
        // ── Host ───────────────────────────────────────────────────────────
        // Override via ?host=tank_1234.local in the URL
        const _urlParams = new URLSearchParams(window.location.search);
        const ESP_HOST = _urlParams.get('host') || window.location.hostname;

        // ── State ──────────────────────────────────────────────────────────
        let ws   = null;
        let ctrl = null;
        let updateCount     = 0;
        let lastOverlayData = null;
        let canvas, ctx;

        // Multi-key tracking
        const pressedKeys = new Set();   // 'w' | 'a' | 's' | 'd'
        let slowMode = false;

        // Last sent values (avoid redundant WS sends)
        let lastL = null;
        let lastR = null;

        // Current motor state for the track-bar widget
        const motorState = {
            left:  { dir: 'stop', percent: 0 },
            right: { dir: 'stop', percent: 0 },
        };

        // ── Canvas init ────────────────────────────────────────────────────
        window.onload = function () {
            canvas = document.getElementById('overlayCanvas');
            ctx    = canvas.getContext('2d');
            connect();
            loadDeviceName();
            loadNetworks();
            loadCtrlParams();
            loadVersion();
        };

        // ── Connection ─────────────────────────────────────────────────────
        function connect() {
            const video = document.getElementById('videoStream');
            video.src = `http://${ESP_HOST}:81/stream`;

            ws = new WebSocket(`ws://${ESP_HOST}/ws`);
            ws.onopen  = () => setDot('dotOverlay', true);
            ws.onclose = () => setDot('dotOverlay', false);
            ws.onerror = (e) => console.error('overlay ws error', e);
            ws.onmessage = function (event) {
                try {
                    lastOverlayData = JSON.parse(event.data);

                    // Update track bars from ESP32-confirmed motor state
                    if (lastOverlayData.motors !== undefined) {
                        motorState.left  = signedToState(lastOverlayData.motors.L);
                        motorState.right = signedToState(lastOverlayData.motors.R);
                    }

                    updateCount++;
                    document.getElementById('updateCount').textContent = updateCount;
                    render();
                } catch (e) {
                    console.error('overlay parse error', e);
                }
            };

            ctrl = new WebSocket(`ws://${ESP_HOST}/ctrl`);
            ctrl.onopen  = () => setDot('dotCtrl', true);
            ctrl.onclose = () => {
                setDot('dotCtrl', false);
                pressedKeys.clear();
                WASD_KEYS.forEach(k => highlight(k, false));
                computeAndSend();
            };
            ctrl.onerror = (e) => console.error('ctrl ws error', e);
        }

        // ── WASD key handling ──────────────────────────────────────────────
        const WASD_KEYS = ['w', 'a', 's', 'd'];

        document.addEventListener('keydown', function (e) {
            if (e.repeat) return;

            if (e.key === 'Shift') {
                slowMode = true;
                updateSlowBadge();
                if (pressedKeys.size > 0) computeAndSend();
                return;
            }

            if (e.key === 'CapsLock') return;

            const key = e.key.toLowerCase();
            if (!WASD_KEYS.includes(key)) return;
            e.preventDefault();

            slowMode = e.shiftKey || e.getModifierState('CapsLock');
            updateSlowBadge();

            pressedKeys.add(key);
            highlight(key, true);
            computeAndSend();
        });

        document.addEventListener('keyup', function (e) {
            if (e.key === 'Shift') {
                slowMode = e.getModifierState('CapsLock');
                updateSlowBadge();
                if (pressedKeys.size > 0) computeAndSend();
                return;
            }

            if (e.key === 'CapsLock') {
                slowMode = e.getModifierState('CapsLock');
                updateSlowBadge();
                if (pressedKeys.size > 0) computeAndSend();
                return;
            }

            const key = e.key.toLowerCase();
            if (!WASD_KEYS.includes(key)) return;

            slowMode = e.shiftKey || e.getModifierState('CapsLock');
            updateSlowBadge();

            pressedKeys.delete(key);
            highlight(key, false);
            computeAndSend();
        });

        // ── Motor value computation ────────────────────────────────────────
        function computeMotorValues() {
            const w = pressedKeys.has('w');
            const s = pressedKeys.has('s');
            const a = pressedKeys.has('a');
            const d = pressedKeys.has('d');

            const fwd   = w && !s;
            const rev   = s && !w;
            const left  = a && !d;
            const right = d && !a;

            let L = 0, R = 0;

            if      (fwd && right) { L =  100; R =    0; }
            else if (fwd && left)  { L =    0; R =  100; }
            else if (rev && right) { L = -100; R =    0; }
            else if (rev && left)  { L =    0; R = -100; }
            else if (fwd)          { L =  100; R =  100; }
            else if (rev)          { L = -100; R = -100; }
            else if (right)        { L =   50; R =  -50; }
            else if (left)         { L =  -50; R =   50; }

            const mult = slowMode ? (1 / 3) : 1;
            return {
                L: Math.round(L * mult),
                R: Math.round(R * mult),
            };
        }

        function computeAndSend() {
            const { L, R } = computeMotorValues();

            if (L === lastL && R === lastR) return;
            lastL = L;
            lastR = R;

            if (ctrl && ctrl.readyState === WebSocket.OPEN) {
                ctrl.send(JSON.stringify({ L, R }));
            }
        }

        function signedToState(v) {
            if (v > 0) return { dir: 'fwd', percent: v };
            if (v < 0) return { dir: 'rev', percent: -v };
            return { dir: 'stop', percent: 0 };
        }

        // ── Render pipeline ────────────────────────────────────────────────
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (lastOverlayData) drawOverlayData(lastOverlayData);
            drawTrackBars();
            drawTelemetryPanel();
        }

        // ── Telemetry HUD panel (top-left) ─────────────────────────────────
        function drawTelemetryPanel() {
            if (!lastOverlayData || !lastOverlayData.telemetry) return;
            const t = lastOverlayData.telemetry;

            // ── Layout constants (canvas units, 1280×720 virtual) ──────────
            const PX   = 8;          // panel left
            const PY   = 8;          // panel top
            const PW   = 212;        // panel width
            const PAD  = 8;          // inner padding
            const ROW  = 17;         // row height (baseline-to-baseline)
            const CX   = PX + PAD;   // content left edge
            const CE   = PX + PW - PAD; // content right edge

            const hasMcuTmp = t.mcu_temp_c > -100;
            const hasCamTmp = t.cam_temp_c !== undefined && t.cam_temp_c > -100;
            const hasTmp    = hasMcuTmp || hasCamTmp;
            const ROWS = hasTmp ? 7 : 6;
            const PH = PAD + ROWS * ROW + PAD;

            // ── Background ─────────────────────────────────────────────────
            ctx.fillStyle = 'rgba(0,0,0,0.58)';
            roundRect(ctx, PX, PY, PW, PH, 5);
            ctx.fill();

            // ── Helpers ────────────────────────────────────────────────────
            // Baseline y of row i (0-indexed)
            function ry(i) { return PY + PAD + (i + 1) * ROW - 3; }

            function bar(x, y, w, h, frac, color) {
                ctx.fillStyle = '#2d2d2d';
                ctx.fillRect(x, y - h, w, h);
                const fw = Math.round(w * Math.max(0, Math.min(1, frac)));
                if (fw > 0) { ctx.fillStyle = color; ctx.fillRect(x, y - h, fw, h); }
            }

            function label(x, y, text) {
                ctx.font = '10px Arial';
                ctx.fillStyle = '#888';
                ctx.fillText(text, x, y);
            }

            function value(x, y, text, color) {
                ctx.font = '11px Arial';
                ctx.fillStyle = color || '#ddd';
                ctx.fillText(text, x, y);
            }

            const LW  = 30;   // label column width
            const BW  = 92;   // bar width
            const BH  = 7;    // bar height (px)
            const BX  = CX + LW + 2;  // bar left edge
            const VX  = BX + BW + 4;  // value text left edge

            ctx.textAlign = 'left';

            // ── Row 0: FPS  ·  uptime ──────────────────────────────────────
            ctx.font = 'bold 12px Arial';
            ctx.fillStyle = '#eee';
            ctx.fillText('FPS ' + t.fps.toFixed(1), CX, ry(0));
            ctx.font = '10px Arial';
            ctx.fillStyle = '#666';
            ctx.textAlign = 'right';
            ctx.fillText('↑ ' + fmtUptime(t.uptime_s), CE, ry(0));
            ctx.textAlign = 'left';

            // ── Row 1: WiFi RSSI signal bars + channel ─────────────────────
            const rssi   = t.rssi;
            const sigQ   = Math.max(0, Math.min(1, (rssi + 90) / 60)); // 0=-90dBm, 1=-30dBm
            const nFill  = Math.round(sigQ * 5);
            const sigClr = sigQ > 0.60 ? '#4CAF50' : sigQ > 0.30 ? '#FF9800' : '#f44336';
            const barYr  = ry(1);
            for (let i = 0; i < 5; i++) {
                const bh = 4 + i * 3;           // 4, 7, 10, 13, 16 px
                ctx.fillStyle = i < nFill ? sigClr : '#3a3a3a';
                ctx.fillRect(CX + i * 8, barYr - bh, 6, bh);
            }
            const rssiClr = sigQ > 0.60 ? '#4CAF50' : sigQ > 0.30 ? '#FF9800' : '#f44336';
            ctx.font = '11px Arial';
            ctx.fillStyle = rssiClr;
            ctx.fillText(rssi + ' dBm', CX + 5 * 8 + 5, barYr);
            if (t.wifi_channel) {
                ctx.font = '10px Arial';
                ctx.fillStyle = '#666';
                ctx.textAlign = 'right';
                ctx.fillText('ch' + t.wifi_channel, CE, barYr);
                ctx.textAlign = 'left';
            }

            // ── Row 2: TX throughput ────────────────────────────────────────
            // Max scale: 20 Mbps = 20 000 kbps (ESP32 802.11n practical ceiling)
            const MAX_KBPS = 20000;
            label(CX,  ry(2), 'TX');
            bar  (BX,  ry(2), BW, BH, t.tx_kbps / MAX_KBPS, '#4CAF50');
            value(VX,  ry(2), fmtKbps(t.tx_kbps));

            // ── Row 3: RX throughput ────────────────────────────────────────
            label(CX,  ry(3), 'RX');
            bar  (BX,  ry(3), BW, BH, t.rx_kbps / MAX_KBPS, '#2196F3');
            value(VX,  ry(3), fmtKbps(t.rx_kbps));

            // ── Row 4: Internal heap ────────────────────────────────────────
            // Reference: ~260 KB is a typical post-boot internal free heap on ESP32
            const HEAP_REF_KB = 260;
            const heapFrac = t.int_heap_kb / HEAP_REF_KB;
            const heapClr  = heapFrac > 0.45 ? '#4CAF50'
                           : heapFrac > 0.20 ? '#FF9800' : '#f44336';
            label(CX,  ry(4), 'INT');
            bar  (BX,  ry(4), BW, BH, heapFrac, heapClr);
            value(VX,  ry(4), t.int_heap_kb + ' KB', heapClr);

            // ── Row 5: Camera exposure + gain ──────────────────────────────
            // AEC 0-1200: low = short exposure (bright scene), high = long (dark)
            // Bar shows exposure; colour: green=bright, orange=mid, red=very dark
            const CAM_AEC_MAX = 1200;
            const aecFrac = (t.cam_aec || 0) / CAM_AEC_MAX;
            const aecClr  = aecFrac < 0.40 ? '#4CAF50'
                          : aecFrac < 0.75 ? '#FF9800' : '#f44336';
            label(CX,  ry(5), 'CAM');
            bar  (BX,  ry(5), BW, BH, aecFrac, aecClr);
            value(VX,  ry(5), 'G' + (t.cam_gain || 0), aecClr);

            // ── Row 6: temperatures — MCU and/or camera on one line ────────
            if (hasTmp) {
                function tmpClr(tc) {
                    return tc < 60 ? '#4CAF50' : tc < 80 ? '#FF9800' : '#f44336';
                }
                if (hasMcuTmp && hasCamTmp) {
                    label(CX,           ry(6), 'MCU');
                    value(CX + LW,      ry(6), t.mcu_temp_c.toFixed(1) + '°', tmpClr(t.mcu_temp_c));
                    const midX = CX + LW + 44;
                    label(midX,         ry(6), 'CAM');
                    value(midX + LW,    ry(6), t.cam_temp_c.toFixed(1) + '°', tmpClr(t.cam_temp_c));
                } else if (hasMcuTmp) {
                    label(CX,      ry(6), 'MCU');
                    value(CX + LW, ry(6), t.mcu_temp_c.toFixed(1) + ' °C', tmpClr(t.mcu_temp_c));
                } else {
                    label(CX,      ry(6), 'CAM');
                    value(CX + LW, ry(6), t.cam_temp_c.toFixed(1) + ' °C', tmpClr(t.cam_temp_c));
                }
            }

            ctx.textAlign = 'left'; // safety reset
        }

        function fmtKbps(kbps) {
            // kbps = kilobits/s  →  display as KB/s or MB/s
            const kBps = kbps / 8;
            if (kBps >= 1000) return (kBps / 1000).toFixed(2) + ' MB/s';
            if (kBps >= 1)    return kBps.toFixed(0) + ' KB/s';
            return '0';
        }

        function fmtUptime(s) {
            const h  = Math.floor(s / 3600);
            const m  = Math.floor((s % 3600) / 60);
            const ss = s % 60;
            if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
            return m + ':' + String(ss).padStart(2,'0');
        }

        // ── Track power bars (top-right corner of canvas) ──────────────────
        function drawTrackBars() {
            const BAR_W  = 22;
            const BAR_H  = 60;
            const GAP    = 18;
            const PAD    = 10;
            const MARGIN =  8;

            const boxW = PAD * 2 + BAR_W * 2 + GAP;
            const boxH = PAD * 2 + BAR_H * 2 + 18;
            const boxX = canvas.width - boxW - MARGIN;
            const boxY = MARGIN;

            ctx.fillStyle = 'rgba(0,0,0,0.60)';
            roundRect(ctx, boxX, boxY, boxW, boxH, 6);
            ctx.fill();

            const xL = boxX + PAD;
            const xR = xL + BAR_W + GAP;
            const yC = boxY + PAD + BAR_H;

            drawSingleBar(xL, yC, BAR_W, BAR_H, motorState.left,  'L');
            drawSingleBar(xR, yC, BAR_W, BAR_H, motorState.right, 'R');
        }

        function drawSingleBar(x, yC, w, h, state, label) {
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(x, yC - h, w, h * 2);

            const fillH = Math.round(h * state.percent / 100);
            if (state.dir === 'fwd' && fillH > 0) {
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(x, yC - fillH, w, fillH);
            } else if (state.dir === 'rev' && fillH > 0) {
                ctx.fillStyle = '#f44336';
                ctx.fillRect(x, yC, w, fillH);
            }

            ctx.fillStyle = '#666';
            ctx.fillRect(x, yC - 1, w, 2);

            if (state.dir !== 'stop') {
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                const arrowY = state.dir === 'fwd'
                    ? yC - Math.max(fillH / 2, 8)
                    : yC + Math.max(fillH / 2, 8) + 5;
                ctx.fillText(state.dir === 'fwd' ? '▲' : '▼', x + w / 2, arrowY);
            }

            ctx.fillStyle = '#aaa';
            ctx.font = 'bold 11px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(label, x + w / 2, yC + h + 14);
            ctx.textAlign = 'left';
        }

        // ── Overlay data rendering ─────────────────────────────────────────
        function drawOverlayData(data) {
            if (data.text && Array.isArray(data.text)) {
                data.text.forEach(function (t) {
                    ctx.font        = `${t.size}px Arial`;
                    ctx.fillStyle   = t.color;
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth   = 2;
                    ctx.strokeText(t.content, t.x, t.y);
                    ctx.fillText(t.content,   t.x, t.y);
                });
            }

            if (data.shapes && Array.isArray(data.shapes)) {
                data.shapes.forEach(function (s) {
                    ctx.strokeStyle = s.color;
                    ctx.fillStyle   = s.color;
                    ctx.lineWidth   = s.width || 2;

                    if (s.type === 'line') {
                        ctx.beginPath();
                        ctx.moveTo(s.x1, s.y1);
                        ctx.lineTo(s.x2, s.y2);
                        ctx.stroke();
                    } else if (s.type === 'rect') {
                        s.fill ? ctx.fillRect(s.x, s.y, s.w, s.h)
                               : ctx.strokeRect(s.x, s.y, s.w, s.h);
                    } else if (s.type === 'circle') {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                        s.fill ? ctx.fill() : ctx.stroke();
                    } else if (s.type === 'triangle') {
                        ctx.beginPath();
                        ctx.moveTo(s.x1, s.y1);
                        ctx.lineTo(s.x2, s.y2);
                        ctx.lineTo(s.x3, s.y3);
                        ctx.closePath();
                        s.fill ? ctx.fill() : ctx.stroke();
                    }
                });
            }
        }

        // ── UI helpers ─────────────────────────────────────────────────────
        function highlight(key, active) {
            const el = document.getElementById('key-' + key);
            if (!el) return;
            el.classList.toggle('active', active);
            el.classList.toggle('slow',   active && slowMode);
        }

        function updateSlowBadge() {
            document.getElementById('slowBadge').style.display = slowMode ? 'inline' : 'none';
            pressedKeys.forEach(k => highlight(k, true));
        }

        function setDot(id, on) {
            const el = document.getElementById(id);
            el.classList.toggle('on',  on);
            el.classList.toggle('off', !on);
        }

        function roundRect(c, x, y, w, h, r) {
            if (c.roundRect) {
                c.roundRect(x, y, w, h, r);
            } else {
                c.beginPath();
                c.moveTo(x + r, y);
                c.lineTo(x + w - r, y);
                c.quadraticCurveTo(x + w, y, x + w, y + r);
                c.lineTo(x + w, y + h - r);
                c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                c.lineTo(x + r, y + h);
                c.quadraticCurveTo(x, y + h, x, y + h - r);
                c.lineTo(x, y + r);
                c.quadraticCurveTo(x, y, x + r, y);
                c.closePath();
            }
        }

        // ── Camera transform ────────────────────────────────────────────────
        let camRotation = 0;

        function setRotation(deg) {
            camRotation = deg;
            ['rot0', 'rot90', 'rot180', 'rot270'].forEach(function (id) {
                document.getElementById(id).classList.toggle(
                    'active-rot', id === 'rot' + deg
                );
            });
            applyVideoTransform();
        }

        function applyVideoTransform() {
            const hm = document.getElementById('hMirrorChk').checked;
            const vm = document.getElementById('vMirrorChk').checked;
            const parts = [];
            if (camRotation)  parts.push('rotate(' + camRotation + 'deg)');
            if (hm)           parts.push('scaleX(-1)');
            if (vm)           parts.push('scaleY(-1)');
            document.getElementById('videoStream').style.transform =
                parts.length ? parts.join(' ') : '';
        }

        // ── Device name ──────────────────────────────────────────────────────
        function loadDeviceName() {
            fetch('http://' + ESP_HOST + '/params/device')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    document.getElementById('deviceName').value = d.name || '';
                    setDeviceMsg('');
                })
                .catch(function () {});
        }

        function saveDeviceName() {
            var name = document.getElementById('deviceName').value.trim();
            if (!name) { setDeviceMsg('Name required', '#f44336'); return; }
            setDeviceMsg('Saving…', '#888');
            fetch('http://' + ESP_HOST + '/params/device', {
                method: 'POST',
                body:   'name=' + encodeURIComponent(name),
            })
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (d.ok) {
                        setDeviceMsg(
                            'Saved! New address: http://' + name + '.local' +
                            ' — reload with ?host=' + name + '.local',
                            '#4CAF50'
                        );
                    } else {
                        setDeviceMsg('Save error.', '#f44336');
                    }
                })
                .catch(function (err) { setDeviceMsg('Error: ' + err, '#f44336'); });
        }

        function setDeviceMsg(msg, color) {
            var el = document.getElementById('deviceMsg');
            el.textContent = msg;
            el.style.color = color || '#888';
        }

        // ── Parameters: WiFi Networks ────────────────────────────────────────
        let networks    = [];
        let currentNet  = -1;

        function loadNetworks() {
            setNetMsg('Loading…', '#888');
            fetch('http://' + ESP_HOST + '/params/networks')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    networks   = data.networks || [];
                    currentNet = typeof data.current === 'number' ? data.current : -1;
                    populateNetSelect();
                    setNetMsg('', '');
                })
                .catch(function (err) {
                    setNetMsg('Load failed: ' + err, '#f44336');
                });
        }

        function populateNetSelect() {
            var sel = document.getElementById('netSelect');
            var prev = sel.value;
            sel.innerHTML = '<option value="new">+ New network</option>';
            networks.forEach(function (net, i) {
                var opt = document.createElement('option');
                opt.value = i;
                var marker = (i === currentNet) ? '★ ' : '';
                opt.textContent = marker + net.ssid +
                    (i === currentNet ? '  (connected)' : '');
                sel.appendChild(opt);
            });
            var prevStillValid = Array.from(sel.options).some(function (o) {
                return o.value === prev;
            });
            sel.value = prevStillValid ? prev : 'new';
            onNetSelectChange();
        }

        function onNetSelectChange() {
            var sel   = document.getElementById('netSelect');
            var isNew = sel.value === 'new';
            var idx   = isNew ? -1 : parseInt(sel.value);

            document.getElementById('newSsidRow').style.display = isNew ? 'flex' : 'none';
            document.getElementById('newSsid').value = '';
            document.getElementById('netPass').value  = (!isNew && networks[idx])
                ? networks[idx].pass : '';
            document.getElementById('deleteNetBtn').disabled = isNew;
            document.getElementById('saveNetBtn').textContent = isNew ? 'Add' : 'Update';
            document.getElementById('netPass').type = 'password';
        }

        function togglePassVisibility() {
            var pass = document.getElementById('netPass');
            pass.type = pass.type === 'password' ? 'text' : 'password';
        }

        function saveNetwork() {
            var sel   = document.getElementById('netSelect');
            var isNew = sel.value === 'new';
            var pass  = document.getElementById('netPass').value;

            var url, body;
            if (isNew) {
                var ssid = document.getElementById('newSsid').value.trim();
                if (!ssid) { setNetMsg('SSID is required.', '#f44336'); return; }
                url  = 'http://' + ESP_HOST + '/params/networks/add';
                body = 'ssid=' + encodeURIComponent(ssid) +
                       '&pass=' + encodeURIComponent(pass);
            } else {
                var idx = parseInt(sel.value);
                url  = 'http://' + ESP_HOST + '/params/networks/update';
                body = 'idx=' + idx + '&pass=' + encodeURIComponent(pass);
            }

            setNetMsg('Saving…', '#888');
            fetch(url, { method: 'POST', body: body })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.ok) {
                        setNetMsg('Saved!', '#4CAF50');
                        loadNetworks();
                    } else {
                        setNetMsg('Save error.', '#f44336');
                    }
                })
                .catch(function (err) {
                    setNetMsg('Request failed: ' + err, '#f44336');
                });
        }

        function deleteNetwork() {
            var idx = parseInt(document.getElementById('netSelect').value);
            if (isNaN(idx)) return;

            var name = (networks[idx] && networks[idx].ssid) ? networks[idx].ssid : '(#' + idx + ')';
            if (!confirm('Delete network "' + name + '"?')) return;

            setNetMsg('Deleting…', '#888');
            fetch('http://' + ESP_HOST + '/params/networks/delete', {
                method: 'POST',
                body:   'idx=' + idx,
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.ok) {
                        setNetMsg('Deleted.', '#4CAF50');
                        loadNetworks();
                    } else {
                        setNetMsg('Delete error.', '#f44336');
                    }
                })
                .catch(function (err) {
                    setNetMsg('Request failed: ' + err, '#f44336');
                });
        }

        function setNetMsg(msg, color) {
            var el = document.getElementById('netMsg');
            el.textContent  = msg;
            el.style.color  = color || '#888';
        }

        // ── Control parameters ────────────────────────────────────────────────
        function loadCtrlParams() {
            fetch('http://' + ESP_HOST + '/params/ctrl')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    document.getElementById('rampRate').value = d.ramp_rate;
                })
                .catch(function () {});
        }

        function onRampKeydown(e) {
            if (e.key === 'Enter') saveRampRate();
        }

        function saveRampRate() {
            var rate = parseInt(document.getElementById('rampRate').value, 10);
            if (isNaN(rate) || rate < 1 || rate > 500) {
                setRampMsg('Enter 1–500', '#f44336');
                return;
            }
            setRampMsg('Saving…', '#888');
            fetch('http://' + ESP_HOST + '/params/ctrl', {
                method: 'POST',
                body:   'ramp_rate=' + rate,
            })
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    setRampMsg(d.ok ? 'Saved' : 'Error', d.ok ? '#4CAF50' : '#f44336');
                })
                .catch(function (err) { setRampMsg('Error: ' + err, '#f44336'); });
        }

        function setRampMsg(msg, color) {
            var el = document.getElementById('rampMsg');
            el.textContent = msg;
            el.style.color = color || '#888';
        }

        // ── Firmware OTA ─────────────────────────────────────────────────────
        function loadVersion() {
            fetch('http://' + ESP_HOST + '/version')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    document.getElementById('fwVersion').textContent =
                        d.version + ' · ' + d.date + ' ' + d.time + ' [' + d.partition + ']';
                })
                .catch(function () {
                    document.getElementById('fwVersion').textContent = 'unavailable';
                });
        }

        function onOtaFileChange() {
            const hasFile = document.getElementById('otaFile').files.length > 0;
            document.getElementById('otaUploadBtn').disabled = !hasFile;
            // Reset progress bar if a new file is chosen
            document.getElementById('otaProgress').style.display = 'none';
            document.getElementById('otaBar').style.width = '0%';
            document.getElementById('otaBar').style.background = '#4CAF50';
            document.getElementById('otaPct').textContent = '0%';
            document.getElementById('otaSpeed').textContent = '—';
            document.getElementById('otaEta').textContent = '—';
            setOtaMsg('', '');
        }

        function startOta() {
            const file = document.getElementById('otaFile').files[0];
            if (!file) return;

            const btn      = document.getElementById('otaUploadBtn');
            const bar      = document.getElementById('otaBar');
            const pctEl    = document.getElementById('otaPct');
            const speedEl  = document.getElementById('otaSpeed');
            const etaEl    = document.getElementById('otaEta');
            const progress = document.getElementById('otaProgress');

            btn.disabled = true;
            bar.style.background = '#4CAF50';
            bar.style.width = '0%';
            progress.style.display = 'block';
            setOtaMsg('Uploading ' + (file.size / 1024).toFixed(0) + ' KB…', '#888');

            const startTime = Date.now();

            const xhr = new XMLHttpRequest();

            xhr.upload.onprogress = function (e) {
                if (!e.lengthComputable) return;
                const pct     = e.loaded / e.total * 100;
                const elapsed = (Date.now() - startTime) / 1000;
                const speed   = elapsed > 0 ? e.loaded / elapsed : 0;      // bytes/s
                const eta     = speed > 0 ? (e.total - e.loaded) / speed : Infinity;

                bar.style.width    = pct.toFixed(1) + '%';
                pctEl.textContent  = pct.toFixed(1) + '%';
                speedEl.textContent = formatSpeed(speed);
                etaEl.textContent  = 'ETA ' + formatEta(eta);
            };

            xhr.onload = function () {
                btn.disabled = false;
                if (xhr.status === 200) {
                    bar.style.width = '100%';
                    pctEl.textContent  = '100%';
                    speedEl.textContent = '';
                    etaEl.textContent  = '';
                    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                    const avg = formatSpeed(file.size / (elapsed || 1));
                    setOtaMsg('Done in ' + elapsed + 's (avg ' + avg + ') — device rebooting…', '#4CAF50');
                } else {
                    bar.style.background = '#f44336';
                    setOtaMsg('Failed (HTTP ' + xhr.status + '): ' + xhr.responseText, '#f44336');
                }
            };

            xhr.onerror = function () {
                btn.disabled = false;
                bar.style.background = '#f44336';
                setOtaMsg('Network error during upload.', '#f44336');
            };

            xhr.open('POST', 'http://' + ESP_HOST + '/ota');
            xhr.setRequestHeader('Content-Type', 'application/octet-stream');
            xhr.send(file);
        }

        function formatSpeed(bps) {
            if (bps >= 1024 * 1024) return (bps / 1024 / 1024).toFixed(2) + ' MB/s';
            if (bps >= 1024)        return (bps / 1024).toFixed(1) + ' KB/s';
            return bps.toFixed(0) + ' B/s';
        }

        function formatEta(sec) {
            if (!isFinite(sec) || sec < 0) return '…';
            if (sec < 60) return Math.ceil(sec) + 's';
            return Math.floor(sec / 60) + 'm ' + Math.ceil(sec % 60) + 's';
        }

        function setOtaMsg(msg, color) {
            var el = document.getElementById('otaMsg');
            el.textContent = msg;
            el.style.color = color || '#888';
        }
    </script>
</body>
