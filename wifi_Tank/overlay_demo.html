<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WiFi Tank</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1320px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        /* ── Status bar ── */
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #555;
            flex-shrink: 0;
        }

        .dot.on  { background-color: #4CAF50; box-shadow: 0 0 8px #4CAF50; }
        .dot.off { background-color: #f44336; }

        /* ── Video + canvas ── */
        .video-container {
            position: relative;
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            border: 2px solid #444;
            border-radius: 5px;
            overflow: hidden;
            background-color: #000;
        }

        #videoStream {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }

        #overlayCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 1280px; height: 720px;
            pointer-events: none;
        }

        /* ── Bottom bar ── */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 16px;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* ── Connection controls ── */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #fff;
            width: 180px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover    { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        /* ── WASD pad ── */
        .wasd-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            user-select: none;
        }

        .wasd-row {
            display: flex;
            gap: 4px;
        }

        .wasd-key {
            width: 48px;
            height: 48px;
            border: 2px solid #555;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #888;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.05s, color 0.05s, border-color 0.05s;
        }

        .wasd-key.active {
            background-color: #4CAF50;
            border-color: #4CAF50;
            color: #fff;
        }

        .wasd-key.active.slow {
            background-color: #ff9800;
            border-color: #ff9800;
        }

        .wasd-key.spacer { visibility: hidden; }

        .wasd-label {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 4px;
        }

        #slowBadge {
            color: #ff9800;
            font-weight: bold;
            margin-left: 6px;
            display: none;
        }

        .error {
            color: #f44336;
            margin-top: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ESP32 WiFi Tank</h1>

        <div class="status">
            <div class="status-item">
                <span class="dot" id="dotOverlay"></span>
                <span>Overlay</span>
                <span style="color:#888;font-size:12px;">(<span id="updateCount">0</span> frames)</span>
            </div>
            <div class="status-item">
                <span class="dot" id="dotCtrl"></span>
                <span>Control</span>
            </div>
        </div>

        <div class="video-container">
            <img id="videoStream" alt="Video Stream" />
            <canvas id="overlayCanvas" width="1280" height="720"></canvas>
        </div>

        <div class="bottom-bar">
            <div>
                <div class="controls">
                    <input type="text" id="espIp" placeholder="ESP32 IP" value="192.168.1.100" />
                    <button id="connectBtn"    onclick="connect()">Connect</button>
                    <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
                </div>
                <div class="error" id="errorMsg"></div>
            </div>

            <div>
                <div class="wasd-pad">
                    <div class="wasd-row">
                        <div class="wasd-key spacer"></div>
                        <div class="wasd-key" id="key-w">W</div>
                        <div class="wasd-key spacer"></div>
                    </div>
                    <div class="wasd-row">
                        <div class="wasd-key" id="key-a">A</div>
                        <div class="wasd-key" id="key-s">S</div>
                        <div class="wasd-key" id="key-d">D</div>
                    </div>
                </div>
                <div class="wasd-label">
                    keyboard control
                    <span id="slowBadge">⅓ SPEED</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ── State ──────────────────────────────────────────────────────────
        let ws   = null;
        let ctrl = null;
        let updateCount     = 0;
        let lastOverlayData = null;
        let canvas, ctx;

        // Multi-key tracking
        const pressedKeys = new Set();   // 'w' | 'a' | 's' | 'd'
        let slowMode = false;

        // Last sent values (avoid redundant WS sends)
        let lastL = null;
        let lastR = null;

        // Current motor state for the track-bar widget
        const motorState = {
            left:  { dir: 'stop', percent: 0 },
            right: { dir: 'stop', percent: 0 },
        };

        // ── Canvas init ────────────────────────────────────────────────────
        window.onload = function () {
            canvas = document.getElementById('overlayCanvas');
            ctx    = canvas.getContext('2d');

            const urlParams = new URLSearchParams(window.location.search);
            const ip = urlParams.get('ip');
            if (ip) {
                document.getElementById('espIp').value = ip;
                connect();
            } else if (window.location.hostname && window.location.protocol !== 'file:') {
                document.getElementById('espIp').value = window.location.hostname;
                connect();
            }
        };

        // ── Connection ─────────────────────────────────────────────────────
        function connect() {
            const ip = document.getElementById('espIp').value.trim();
            if (!ip) { showError('Please enter ESP32 IP address'); return; }
            showError('');

            const video = document.getElementById('videoStream');
            video.src = `http://${ip}:81/stream`;
            video.onerror = () => showError('Video stream failed — check IP and ESP32.');

            ws = new WebSocket(`ws://${ip}/ws`);
            ws.onopen  = () => setDot('dotOverlay', true);
            ws.onclose = () => setDot('dotOverlay', false);
            ws.onerror = (e) => console.error('overlay ws error', e);
            ws.onmessage = function (event) {
                try {
                    lastOverlayData = JSON.parse(event.data);

                    // Update track bars from ESP32-confirmed motor state
                    if (lastOverlayData.motors !== undefined) {
                        motorState.left  = signedToState(lastOverlayData.motors.L);
                        motorState.right = signedToState(lastOverlayData.motors.R);
                    }

                    updateCount++;
                    document.getElementById('updateCount').textContent = updateCount;
                    render();
                } catch (e) {
                    console.error('overlay parse error', e);
                }
            };

            ctrl = new WebSocket(`ws://${ip}/ctrl`);
            ctrl.onopen  = () => setDot('dotCtrl', true);
            ctrl.onclose = () => {
                setDot('dotCtrl', false);
                pressedKeys.clear();
                WASD_KEYS.forEach(k => highlight(k, false));
                computeAndSend();   // sends {L:0,R:0} if still open (no-op if closed)
            };
            ctrl.onerror = (e) => console.error('ctrl ws error', e);

            document.getElementById('connectBtn').disabled    = true;
            document.getElementById('disconnectBtn').disabled = false;
        }

        function disconnect() {
            if (ws)   { ws.close();   ws   = null; }
            if (ctrl) { ctrl.close(); ctrl = null; }
            document.getElementById('videoStream').src = '';
            lastOverlayData = null;
            updateCount = 0;
            document.getElementById('updateCount').textContent = '0';
            pressedKeys.clear();
            WASD_KEYS.forEach(k => highlight(k, false));
            slowMode = false;
            updateSlowBadge();
            lastL = lastR = null;
            motorState.left = motorState.right = { dir: 'stop', percent: 0 };
            render();
            document.getElementById('connectBtn').disabled    = false;
            document.getElementById('disconnectBtn').disabled = true;
        }

        // ── WASD key handling ──────────────────────────────────────────────
        const WASD_KEYS = ['w', 'a', 's', 'd'];

        document.addEventListener('keydown', function (e) {
            if (e.repeat) return;

            // Shift key alone: recompute speed if WASD is held
            if (e.key === 'Shift') {
                slowMode = true;
                updateSlowBadge();
                if (pressedKeys.size > 0) computeAndSend();
                return;
            }

            // CapsLock: state available reliably on keyup (see below)
            if (e.key === 'CapsLock') return;

            const key = e.key.toLowerCase();
            if (!WASD_KEYS.includes(key)) return;
            e.preventDefault();

            // Update slow mode from current modifiers
            slowMode = e.shiftKey || e.getModifierState('CapsLock');
            updateSlowBadge();

            pressedKeys.add(key);
            highlight(key, true);
            computeAndSend();
        });

        document.addEventListener('keyup', function (e) {
            if (e.key === 'Shift') {
                slowMode = e.getModifierState('CapsLock');
                updateSlowBadge();
                if (pressedKeys.size > 0) computeAndSend();
                return;
            }

            // CapsLock: read the new (post-toggle) state on keyup
            if (e.key === 'CapsLock') {
                slowMode = e.getModifierState('CapsLock');
                updateSlowBadge();
                if (pressedKeys.size > 0) computeAndSend();
                return;
            }

            const key = e.key.toLowerCase();
            if (!WASD_KEYS.includes(key)) return;

            slowMode = e.shiftKey || e.getModifierState('CapsLock');
            updateSlowBadge();

            pressedKeys.delete(key);
            highlight(key, false);
            computeAndSend();
        });

        // ── Motor value computation ────────────────────────────────────────
        //
        // Key combination → L, R (base, no multiplier)
        //
        //  W       →  100,  100   straight forward
        //  S       → -100, -100   straight reverse
        //  A       →  -50,   50   pivot left
        //  D       →   50,  -50   pivot right
        //  W+D     →  100,    0   arc right (left track only)
        //  W+A     →    0,  100   arc left  (right track only)
        //  S+D     → -100,    0   reverse arc right
        //  S+A     →    0, -100   reverse arc left
        //  W+S / A+D → cancel → 0, 0
        //
        //  Shift / CapsLock → multiply all by 1/3

        function computeMotorValues() {
            const w = pressedKeys.has('w');
            const s = pressedKeys.has('s');
            const a = pressedKeys.has('a');
            const d = pressedKeys.has('d');

            const fwd   = w && !s;
            const rev   = s && !w;
            const left  = a && !d;
            const right = d && !a;

            let L = 0, R = 0;

            if      (fwd && right) { L =  100; R =    0; }
            else if (fwd && left)  { L =    0; R =  100; }
            else if (rev && right) { L = -100; R =    0; }
            else if (rev && left)  { L =    0; R = -100; }
            else if (fwd)          { L =  100; R =  100; }
            else if (rev)          { L = -100; R = -100; }
            else if (right)        { L =   50; R =  -50; }
            else if (left)         { L =  -50; R =   50; }

            const mult = slowMode ? (1 / 3) : 1;
            return {
                L: Math.round(L * mult),
                R: Math.round(R * mult),
            };
        }

        function computeAndSend() {
            const { L, R } = computeMotorValues();

            // Skip if nothing changed
            if (L === lastL && R === lastR) return;
            lastL = L;
            lastR = R;

            // Send to ESP32
            if (ctrl && ctrl.readyState === WebSocket.OPEN) {
                ctrl.send(JSON.stringify({ L, R }));
            }
        }

        function signedToState(v) {
            if (v > 0) return { dir: 'fwd', percent: v };
            if (v < 0) return { dir: 'rev', percent: -v };
            return { dir: 'stop', percent: 0 };
        }

        // ── Render pipeline ────────────────────────────────────────────────
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (lastOverlayData) drawOverlayData(lastOverlayData);
            drawTrackBars();
        }

        // ── Track power bars (top-right corner of canvas) ──────────────────
        function drawTrackBars() {
            const BAR_W  = 22;
            const BAR_H  = 60;   // half-height; fill grows up (fwd) or down (rev)
            const GAP    = 18;
            const PAD    = 10;
            const MARGIN =  8;

            const boxW = PAD * 2 + BAR_W * 2 + GAP;
            const boxH = PAD * 2 + BAR_H * 2 + 18;
            const boxX = canvas.width - boxW - MARGIN;
            const boxY = MARGIN;

            ctx.fillStyle = 'rgba(0,0,0,0.60)';
            roundRect(ctx, boxX, boxY, boxW, boxH, 6);
            ctx.fill();

            const xL = boxX + PAD;
            const xR = xL + BAR_W + GAP;
            const yC = boxY + PAD + BAR_H;

            drawSingleBar(xL, yC, BAR_W, BAR_H, motorState.left,  'L');
            drawSingleBar(xR, yC, BAR_W, BAR_H, motorState.right, 'R');
        }

        function drawSingleBar(x, yC, w, h, state, label) {
            // Trough
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(x, yC - h, w, h * 2);

            // Fill
            const fillH = Math.round(h * state.percent / 100);
            if (state.dir === 'fwd' && fillH > 0) {
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(x, yC - fillH, w, fillH);
            } else if (state.dir === 'rev' && fillH > 0) {
                ctx.fillStyle = '#f44336';
                ctx.fillRect(x, yC, w, fillH);
            }

            // Centre divider
            ctx.fillStyle = '#666';
            ctx.fillRect(x, yC - 1, w, 2);

            // Direction arrow
            if (state.dir !== 'stop') {
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                const arrowY = state.dir === 'fwd'
                    ? yC - Math.max(fillH / 2, 8)
                    : yC + Math.max(fillH / 2, 8) + 5;
                ctx.fillText(state.dir === 'fwd' ? '▲' : '▼', x + w / 2, arrowY);
            }

            // Track label
            ctx.fillStyle = '#aaa';
            ctx.font = 'bold 11px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(label, x + w / 2, yC + h + 14);
            ctx.textAlign = 'left';
        }

        // ── Overlay data rendering ─────────────────────────────────────────
        function drawOverlayData(data) {
            if (data.text && Array.isArray(data.text)) {
                data.text.forEach(function (t) {
                    ctx.font        = `${t.size}px Arial`;
                    ctx.fillStyle   = t.color;
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth   = 2;
                    ctx.strokeText(t.content, t.x, t.y);
                    ctx.fillText(t.content,   t.x, t.y);
                });
            }

            if (data.shapes && Array.isArray(data.shapes)) {
                data.shapes.forEach(function (s) {
                    ctx.strokeStyle = s.color;
                    ctx.fillStyle   = s.color;
                    ctx.lineWidth   = s.width || 2;

                    if (s.type === 'line') {
                        ctx.beginPath();
                        ctx.moveTo(s.x1, s.y1);
                        ctx.lineTo(s.x2, s.y2);
                        ctx.stroke();
                    } else if (s.type === 'rect') {
                        s.fill ? ctx.fillRect(s.x, s.y, s.w, s.h)
                               : ctx.strokeRect(s.x, s.y, s.w, s.h);
                    } else if (s.type === 'circle') {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                        s.fill ? ctx.fill() : ctx.stroke();
                    } else if (s.type === 'triangle') {
                        ctx.beginPath();
                        ctx.moveTo(s.x1, s.y1);
                        ctx.lineTo(s.x2, s.y2);
                        ctx.lineTo(s.x3, s.y3);
                        ctx.closePath();
                        s.fill ? ctx.fill() : ctx.stroke();
                    }
                });
            }
        }

        // ── UI helpers ─────────────────────────────────────────────────────
        function highlight(key, active) {
            const el = document.getElementById('key-' + key);
            if (!el) return;
            el.classList.toggle('active', active);
            el.classList.toggle('slow',   active && slowMode);
        }

        function updateSlowBadge() {
            document.getElementById('slowBadge').style.display = slowMode ? 'inline' : 'none';
            // Re-colour any currently pressed keys
            pressedKeys.forEach(k => highlight(k, true));
        }

        function setDot(id, on) {
            const el = document.getElementById(id);
            el.classList.toggle('on',  on);
            el.classList.toggle('off', !on);
        }

        function showError(msg) {
            document.getElementById('errorMsg').textContent = msg;
        }

        function roundRect(c, x, y, w, h, r) {
            if (c.roundRect) {
                c.roundRect(x, y, w, h, r);
            } else {
                c.beginPath();
                c.moveTo(x + r, y);
                c.lineTo(x + w - r, y);
                c.quadraticCurveTo(x + w, y, x + w, y + r);
                c.lineTo(x + w, y + h - r);
                c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                c.lineTo(x + r, y + h);
                c.quadraticCurveTo(x, y + h, x, y + h - r);
                c.lineTo(x, y + r);
                c.quadraticCurveTo(x, y, x + r, y);
                c.closePath();
            }
        }

        document.getElementById('espIp').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') connect();
        });
    </script>
</body>
</html>
